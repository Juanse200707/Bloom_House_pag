<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace – Bloom House</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="nav"></div>

<header class="bg-dark text-white py-5">
  <div class="container"><h1>Marketplace de Flores</h1><p id="resumen" class="mb-0"></p></div>
</header>

<main class="container py-4">
  <div id="filtros" class="row g-2 mb-3">
    <div class="col-12"><input id="q" class="form-control" placeholder="Buscar flores, floristerías..."></div>
    <div class="col-6 col-md-2"><select id="localidad" class="form-select"></select></div>
    <div class="col-6 col-md-3"><select id="empresa" class="form-select"></select></div>
    <div class="col-6 col-md-2"><select id="tipo" class="form-select"></select></div>
    <div class="col-6 col-md-2"><select id="disp" class="form-select"></select></div>
    <div class="col-12 col-md-3">
      <select id="orden" class="form-select">
        <option value="pop">Más populares</option>
        <option value="asc">Menor precio</option>
        <option value="desc">Mayor precio</option>
      </select>
    </div>
  </div>
  <div id="pills" class="d-flex flex-wrap gap-2 mb-4"></div>
  <div id="lista" class="row g-3"></div>
</main>

<div class="modal fade" id="md"><div class="modal-dialog"><div class="modal-content"><div class="modal-body" id="mb"></div></div></div></div>

<div id="pie"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/comun.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
