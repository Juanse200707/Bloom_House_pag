<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso – Bloom House</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<main class="container py-4" style="max-width:520px">
  <div class="card"><div class="card-body">
    <h4 id="titulo" class="mb-3"></h4>
    <ul class="nav nav-pills nav-fill mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#t1">Iniciar sesión</button></li>
      <li class="nav-item" id="breg"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#t2">Registrarse</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="t1">
        <form id="login">
          <label class="form-label">Correo</label><input id="le" type="email" class="form-control mb-2" required>
          <label class="form-label">Contraseña</label><input id="lp" type="password" class="form-control mb-3" required>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
      <div class="tab-pane fade" id="t2">
        <form id="registro">
          <input name="nombre" class="form-control mb-2" placeholder="Nombre / Floristería" required>
          <input name="email" type="email" class="form-control mb-2" placeholder="Correo" required>
          <input name="password" type="password" class="form-control mb-2" placeholder="Contraseña (mín. 8)" required>
          <select name="localidad" class="form-select mb-2 solo-empresa"></select>
          <input name="ciudad" class="form-control mb-2 solo-empresa" placeholder="Ciudad">
          <input name="whatsapp" class="form-control mb-2 solo-empresa" placeholder="WhatsApp (57300...)">
          <div class="form-check mb-3">
            <input name="terminos" type="checkbox" class="form-check-input">
            <label class="form-check-label small">Acepto los <a href="terminos.html">términos y condiciones</a></label>
          </div>
          <button class="btn btn-primary w-100">Crear cuenta</button>
        </form>
      </div>
    </div>
  </div></div>
</main>

<div id="pie"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/comun.js"></script>
<script src="js/autenticacion.js"></script>
</body>
</html>
