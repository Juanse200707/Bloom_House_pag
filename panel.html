<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel – Bloom House</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<main class="container py-4">
  <h2 id="titulo">Panel</h2>
  <div id="informe" class="row g-2 mb-4"></div>

  <div class="d-flex justify-content-between">
    <h4>Productos e inventario</h4>
    <button class="btn btn-danger btn-sm" id="nuevo">+ Nuevo producto</button>
  </div>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Producto</th><th>Filtros</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tp"></tbody>
    </table>
  </div>

  <h4 class="mt-4">Pedidos</h4>
  <div class="table-responsive"><table class="table"><tbody id="tped"></tbody></table></div>

  <div id="adm" class="d-none">
    <h4 class="mt-4">Usuarios</h4>
    <div class="table-responsive"><table class="table"><tbody id="tu"></tbody></table></div>
  </div>
</main>

<div class="modal fade" id="mf"><div class="modal-dialog">
  <form class="modal-content" id="f">
    <div class="modal-header"><h5>Producto</h5></div>
    <div class="modal-body">
      <input name="nombre" class="form-control mb-2" placeholder="Nombre" required>
      <textarea name="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>
      <input name="imagen" class="form-control mb-2" placeholder="URL de la imagen (opcional)">
      <div class="row g-2">
        <div class="col-6"><input name="precio" type="number" min="0" class="form-control" placeholder="Precio" required></div>
        <div class="col-6"><input name="stock" type="number" min="0" class="form-control" placeholder="Stock" required></div>
        <div class="col-6"><select name="categoria" class="form-select"></select></div>
        <div class="col-6"><select name="tipo" class="form-select"></select></div>
        <div class="col-6"><select name="localidad" class="form-select"></select></div>
        <div class="col-6">
          <select name="etiqueta" class="form-select">
            <option value="">Sin etiqueta</option><option>Nuevo</option><option>Oferta</option><option>Más vendido</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-danger">Guardar</button>
    </div>
  </form>
</div></div>

<div id="pie"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/comun.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
